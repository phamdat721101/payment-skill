name: release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

# id-token: write is REQUIRED for `npm publish --provenance` to produce
# a Sigstore + transparency-log attestation tying the artifact to this
# workflow run. This is what retires the "unverified credentials" flag.
permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Publish n-payment-skill with provenance
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies (clean)
        run: npm ci

      - name: Typecheck
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Publish to npm with provenance
        run: npm run publish:provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
